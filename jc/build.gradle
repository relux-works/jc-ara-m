plugins {
    id 'java'
    id 'jacoco'
}

group = 'works.relux'
version = '0.1.0'

java {
    // Java Card Classic targets Java 8 bytecode.
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    // Casts keep JCVM array operands visibly short-typed. RandomData's JC 3.0.4
    // API is deprecated only by the newer jCardSim compile stubs.
    options.compilerArgs += ['-Xlint:all,-options,-cast,-deprecation']
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://javacard.pro/maven')
    }
}

configurations {
    globalPlatformApi
}

dependencies {
    // jCardSim supplies the Java Card API stubs to main and simulates the applet in tests.
    implementation 'com.klinec:jcardsim:3.0.5.9'
    implementation 'org.globalplatform:javacard:1.1'
    globalPlatformApi 'org.globalplatform:javacard:1.1'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Third-party SEAC decoder used purely as a test oracle for our FF40/FF60
    // stream. Test scope only: the CAP is converted from src/main/java plus the
    // globalPlatformApi configuration, so this never reaches the card.
    testImplementation 'com.github.martinpaljak:globalplatformpro:19.06.16'
}

tasks.register('prepareCapDependencies', Copy) {
    from configurations.globalPlatformApi
    into layout.buildDirectory.dir('cap-dependencies')
}

// The CAP is converted from src/main/java plus whatever prepareCapDependencies stages,
// so a test-scope dependency can never reach the card. This gate makes that structural:
// adding a test oracle (or anything else) to globalPlatformApi fails the build.
tasks.register('verifyCapDependenciesAreMinimal') {
    def capJars = configurations.globalPlatformApi
    inputs.files capJars
    doLast {
        def names = capJars.files.collect { it.name }.sort()
        if (names != ['javacard-1.1.jar']) {
            throw new GradleException(
                    "The CAP import set must stay the GlobalPlatform API alone, was ${names}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyCapDependenciesAreMinimal'
}

test {
    useJUnitPlatform()
    jvmArgs '--add-modules', 'java.smartcardio'
    // Soak knobs shared by both fuzz harnesses — AraMPersonalizationFuzzTest and
    // AraMInstallParameterFuzzTest read the same property names, so these widen both at once.
    // Unset in CI, so the committed run stays the deterministic regression corpus; pass
    // -Param.fuzz.seed / -Param.fuzz.mutants to widen it. Note that the install harness's pinned
    // golden decision vector is skipped under either knob, since it is pinned to the default corpus.
    ['aram.fuzz.seed', 'aram.fuzz.mutants'].each { key ->
        if (project.hasProperty(key)) {
            systemProperty key, project.property(key)
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
